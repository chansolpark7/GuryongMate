services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: guryong
      POSTGRES_PASSWORD: guryong
      POSTGRES_DB: guryongmate
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guryong -d guryongmate"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://guryong:guryong@db:5432/guryongmate
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/srv
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Linux 에서도 호스트의 Ollama 접속
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
